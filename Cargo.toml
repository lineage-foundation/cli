[package]
name = "lineage-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lineage"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
lineage-sdk = { git = "https://github.com/lineage-foundation/sdk-rust", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
